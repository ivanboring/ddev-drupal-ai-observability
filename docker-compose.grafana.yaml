services:
  grafana:
    container_name: "ddev-${DDEV_SITENAME}-grafana"
    # Pinned: newer grafana images removed the grafana-server binary that the
    # entrypoint below relies on. All stack images in this add-on are pinned
    # to the versions the configs and dashboards were verified against.
    image: grafana/grafana:12.3.1
    user: "${UID:-}:${GID:-}"
    entrypoint:
      - /usr/share/grafana/bin/grafana-server
      - --homepath=/usr/share/grafana
      - --config=/etc/grafana-config/grafana.ini
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    volumes:
      - type: bind
        source: ./grafana/grafana/config
        target: /etc/grafana-config
      - type: bind
        source: ./grafana/grafana/datasources
        target: /etc/grafana/provisioning/datasources
      - type: bind
        source: ./grafana/grafana/dashboards-provisioning
        target: /etc/grafana/provisioning/dashboards
      - type: bind
        source: ./grafana/grafana/dashboards
        target: /var/lib/grafana/dashboards
    environment:
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      - HTTP_EXPOSE=3000:3000
      - HTTPS_EXPOSE=3000:3000
